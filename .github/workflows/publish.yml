name: Publish

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, validate and publish the snapshot
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS --retry 3 -o /tmp/current.json https://proxyticker.com/api/v1/current.json
          curl -fsS --retry 3 -o /tmp/providers.json https://proxyticker.com/api/v1/providers.json

          current_generated_at=$(jq -e -r '.generated_at' /tmp/current.json)
          providers_generated_at=$(jq -e -r '.generated_at' /tmp/providers.json)

          if [ "$current_generated_at" != "$providers_generated_at" ]; then
            echo "generated_at mismatch: current.json=$current_generated_at providers.json=$providers_generated_at" >&2
            exit 1
          fi

          mv /tmp/current.json current.json
          mv /tmp/providers.json providers.json

          # A price table is a ready-made block from the API. Its failure must not hold back
          # the JSON: README stays as is, the run ends red after the push.
          # Sets table_problem (empty on success) for the block between the two markers.
          update_table() {
            local url=$1 marker_start=$2 marker_end=$3 start_line end_line
            table_problem=""

            if ! curl -fsS --retry 3 -o /tmp/readme-table.md "$url"; then
              table_problem="could not download $url"
            elif [ "$(head -n 1 /tmp/readme-table.md)" != "<!-- generated_at: $current_generated_at -->" ]; then
              table_problem="$url does not start with the generated_at marker $current_generated_at"
            elif [ "$(grep -c -x -F "$marker_start" README.md)" != "1" ] || [ "$(grep -c -x -F "$marker_end" README.md)" != "1" ]; then
              table_problem="README.md must contain exactly one $marker_start and one $marker_end"
            else
              start_line=$(grep -n -x -F "$marker_start" README.md | cut -d: -f1)
              end_line=$(grep -n -x -F "$marker_end" README.md | cut -d: -f1)
              if [ "$start_line" -ge "$end_line" ]; then
                table_problem="$marker_start must be above $marker_end in README.md"
              else
                awk -v table=/tmp/readme-table.md -v start="$marker_start" -v end="$marker_end" '
                  $0 == end { skipping = 0 }
                  !skipping { print }
                  $0 == start {
                    while ((getline line < table) > 0) print line
                    close(table)
                    skipping = 1
                  }
                ' README.md > /tmp/README.new
                mv /tmp/README.new README.md
              fi
            fi
          }

          update_table https://proxyticker.com/api/v1/readme-table.md '<!-- prices:start -->' '<!-- prices:end -->'
          table_problem_residential=$table_problem

          # Mobile is a separate category: whatever goes wrong here (download, invalid JSON,
          # generated_at mismatch, table) leaves the mobile files as they were and never
          # holds back the residential publish above.
          mobile_problem=""
          if ! curl -fsS --retry 3 -o /tmp/current-mobile.json https://proxyticker.com/api/v1/current-mobile.json; then
            mobile_problem="could not download current-mobile.json"
          elif ! mobile_generated_at=$(jq -e -r '.generated_at' /tmp/current-mobile.json); then
            mobile_problem="current-mobile.json is not valid JSON or has no generated_at"
          elif [ "$mobile_generated_at" != "$current_generated_at" ]; then
            mobile_problem="generated_at mismatch: current-mobile.json=$mobile_generated_at current.json=$current_generated_at"
          else
            mv /tmp/current-mobile.json current-mobile.json
            update_table https://proxyticker.com/api/v1/readme-table-mobile.md '<!-- prices-mobile:start -->' '<!-- prices-mobile:end -->'
            mobile_problem=$table_problem
          fi

          if [ -n "$table_problem_residential" ]; then
            echo "::warning::price table not updated: $table_problem_residential"
          fi
          if [ -n "$mobile_problem" ]; then
            echo "::warning::mobile data not fully updated: $mobile_problem"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          git add current.json providers.json README.md
          if [ -f current-mobile.json ]; then
            git add current-mobile.json
          fi

          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "chore(data): snapshot $current_generated_at"
            git push
          fi

          if [ -n "$table_problem_residential" ]; then
            echo "price table was not updated: $table_problem_residential" >&2
          fi
          if [ -n "$mobile_problem" ]; then
            echo "mobile data was not fully updated: $mobile_problem" >&2
          fi
          if [ -n "$table_problem_residential$mobile_problem" ]; then
            exit 1
          fi
